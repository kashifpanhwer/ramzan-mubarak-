<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Islamic Pro | Ramzan 2026</title>
    
    <link rel="manifest" href="data:application/manifest+json,{'name':'Islamic Pro','short_name':'IslamicApp','start_url':'/','display':'standalone','background_color':'#010f0c','theme_color':'#d4af37','icons':[{'src':'https://cdn-icons-png.flaticon.com/512/2913/2913340.png','sizes':'512x512','type':'image/png'}]}">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#d4af37">

    <style>
        :root { --gold: #d4af37; --bg: #010a08; --glass: rgba(255, 255, 255, 0.08); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: white; font-family: -apple-system, sans-serif; margin: 0; padding-bottom: 100px; }

        .header { padding: 40px 20px; text-align: center; border-bottom: 1px solid rgba(212,175,55,0.2); }
        .title { font-size: 1.8rem; font-weight: 800; color: var(--gold); letter-spacing: 2px; margin: 0; }

        /* 🔥 High-Visibility Install Button */
        #install-section {
            background: linear-gradient(135deg, #d4af37, #f1d3a1);
            color: #000; padding: 18px; margin: 20px; border-radius: 20px;
            text-align: center; font-weight: 900; cursor: pointer;
            display: none; box-shadow: 0 10px 30px rgba(212,175,55,0.4);
            font-size: 1.1rem;
        }

        .container { padding: 20px; max-width: 500px; margin: auto; }

        /* Digital Tasbeeh UI */
        .tasbeeh-card { background: #0a1f1a; border-radius: 40px; padding: 30px; text-align: center; border: 4px solid #1a332d; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        .digital-box { background: #8fa391; color: #1a1a1a; font-family: 'Courier New', monospace; font-size: 5rem; border-radius: 12px; margin-bottom: 25px; font-weight: bold; border: 6px inset rgba(0,0,0,0.2); text-shadow: 1px 1px 0px rgba(255,255,255,0.3); }
        .btn-tap { width: 140px; height: 140px; background: radial-gradient(circle, var(--gold), #8b6508); border-radius: 50%; margin: auto; border: 6px solid #4a3704; box-shadow: 0 10px 0 #332602; cursor: pointer; active: transform: translateY(6px); }
        .btn-tap:active { transform: translateY(8px); box-shadow: 0 2px 0 #332602; }

        .names-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .name-card { background: var(--glass); border: 1px solid rgba(212,175,55,0.2); border-radius: 20px; padding: 20px; text-align: center; }
        .ar { font-size: 2rem; color: var(--gold); margin-bottom: 8px; }

        .nav { position: fixed; bottom: 25px; left: 20px; right: 20px; background: rgba(15,15,15,0.95); backdrop-filter: blur(15px); border-radius: 35px; display: flex; padding: 15px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .nav-item { flex: 1; text-align: center; color: #555; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
        .nav-item.active { color: var(--gold); }

        .section { display: none; }
        .active { display: block; }
    </style>
</head>
<body>

<div class="header">
    <p class="title">RAMZAN MUBARAK</p>
</div>

<div id="install-section" onclick="triggerInstall()">
    📲 INSTALL OFFICIAL APP
</div>

<div class="container">
    <div id="tasbeeh" class="section active">
        <div class="tasbeeh-card">
            <div id="counter" class="digital-box">00</div>
            <p id="zikr-label" style="color:var(--gold); font-weight:bold; letter-spacing:3px; font-size: 1.2rem;">SUBHANALLAH</p>
            <div class="btn-tap" onclick="countTap()"></div>
            <p onclick="countReset()" style="margin-top:25px; opacity:0.4; font-size:0.9rem; text-decoration: underline;">RESET COUNTER</p>
        </div>
    </div>

    <div id="names" class="section">
        <div class="names-grid" id="grid"></div>
    </div>
</div>

<div class="nav">
    <div class="nav-item active" onclick="tab('tasbeeh', this)">📿<br>TASBEEH</div>
    <div class="nav-item" onclick="tab('names', this)">✨<br>99 NAMES</div>
</div>

<script>
    // Register Service Worker for PWA (Essential for Install Button)
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            const swCode = `
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
            `;
            const blob = new Blob([swCode], { type: 'text/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl);
        });
    }

    // Tab Logic
    function tab(id, el) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    // Tasbeeh Logic
    let c = 0;
    function countTap() {
        c++;
        document.getElementById('counter').innerText = c.toString().padStart(2, '0');
        if(navigator.vibrate) navigator.vibrate(30);
        let lbl = document.getElementById('zikr-label');
        if(c <= 33) lbl.innerText = "SUBHANALLAH";
        else if(c <= 66) lbl.innerText = "ALHAMDULILLAH";
        else lbl.innerText = "ALLAHU AKBAR";
    }
    function countReset() { c = 0; document.getElementById('counter').innerText = "00"; }

    // Names Loading (All 99)
    const nData = [
        {ar:"الرحمن",en:"Ar-Rahman"},{ar:"الرحيم",en:"Ar-Rahim"},{ar:"الملك",en:"Al-Malik"},{ar:"القدوس",en:"Al-Quddus"},{ar:"السلام",en:"As-Salam"},{ar:"المؤمن",en:"Al-Mu'min"},{ar:"المهيمن",en:"Al-Muhaymin"},{ar:"العزيز",en:"Al-Aziz"},{ar:"الجبار",en:"Al-Jabbar"},{ar:"المتكبر",en:"Al-Mutakabbir"},{ar:"الخالق",en:"Al-Khaliq"},{ar:"البارئ",en:"Al-Bari"},{ar:"المصور",en:"Al-Musawwir"},{ar:"الغفار",en:"Al-Ghaffar"},{ar:"القهار",en:"Al-Qahhar"},{ar:"الوهاب",en:"Al-Wahhab"},{ar:"الرزاق",en:"Ar-Razzaq"},{ar:"الفتاح",en:"Al-Fattah"},{ar:"العليم",en:"Al-Alim"},{ar:"القابض",en:"Al-Qabid"},{ar:"الباسط",en:"Al-Basit"},{ar:"الخافض",en:"Al-Khafid"},{ar:"الرافع",en:"Ar-Rafi"},{ar:"المعز",en:"Al-Mu'izz"},{ar:"المذل",en:"Al-Mudhill"},{ar:"السميع",en:"As-Sami"},{ar:"البصير",en:"Al-Basir"},{ar:"الحكم",en:"Al-Hakam"},{ar:"العدل",en:"Al-Adl"},{ar:"اللطيف",en:"Al-Latif"},{ar:"الخبير",en:"Al-Khabir"},{ar:"الحليم",en:"Al-Halim"},{ar:"العظيم",en:"Al-Azim"},{ar:"الغفور",en:"Al-Ghafur"},{ar:"الشكور",en:"Ash-Shakur"},{ar:"العلي",en:"Al-Ali"},{ar:"الكبير",en:"Al-Kabir"},{ar:"الحفيظ",en:"Al-Hafiz"},{ar:"المقيت",en:"Al-Muqit"},{ar:"الحسيب",en:"Al-Hasib"},{ar:"الجليل",en:"Al-Jalil"},{ar:"الكريم",en:"Al-Karim"},{ar:"الرقيب",en:"Ar-Raqib"},{ar:"المجيب",en:"Al-Mujib"},{ar:"الواسع",en:"Al-Wasi"},{ar:"الحكيم",en:"Al-Hakim"},{ar:"الودود",en:"Al-Wadud"},{ar:"المجيد",en:"Al-Majid"},{ar:"الباعث",en:"Al-Ba'ith"},{ar:"الشهيد",en:"Ash-Shahid"},{ar:"الحق",en:"Al-Haqq"},{ar:"الوكيل",en:"Al-Wakil"},{ar:"القوي",en:"Al-Qawi"},{ar:"المتين",en:"Al-Matin"},{ar:"الولي",en:"Al-Wali"},{ar:"الحميد",en:"Al-Hamid"},{ar:"المحصي",en:"Al-Muhsi"},{ar:"المبدئ",en:"Al-Mubdi"},{ar:"المعيد",en:"Al-Mu'id"},{ar:"المحيي",en:"Al-Muhyi"},{ar:"المميت",en:"Al-Mumit"},{ar:"الحي",en:"Al-Hayy"},{ar:"القيوم",en:"Al-Qayyum"},{ar:"الواجد",en:"Al-Wajid"},{ar:"الماجد",en:"Al-Majid"},{ar:"الواحد",en:"Al-Wahid"},{ar:"الأحد",en:"Al-Ahad"},{ar:"الصمد",en:"As-Samad"},{ar:"القادر",en:"Al-Qadir"},{ar:"المقتدر",en:"Al-Muqtadir"},{ar:"المقدم",en:"Al-Muqaddim"},{ar:"المؤخر",en:"Al-Mu'akhkhir"},{ar:"الأول",en:"Al-Awwal"},{ar:"الآخر",en:"Al-Akhir"},{ar:"الظاهر",en:"Az-Zahir"},{ar:"الباطن",en:"Al-Batin"},{ar:"الوالي",en:"Al-Wali"},{ar:"المتعالي",en:"Al-Muta'ali"},{ar:"البر",en:"Al-Barr"},{ar:"التواب",en:"At-Tawwab"},{ar:"المنتقم",en:"Al-Muntaqim"},{ar:"العفو",en:"Al-Afuww"},{ar:"الرؤوف",en:"Ar-Ra'uf"},{ar:"مالك الملك",en:"Malik-ul-Mulk"},{ar:"ذو الجلال والإكرام",en:"Dhul-Jalali-wal-Ikram"},{ar:"المقسط",en:"Al-Muqsit"},{ar:"الجامع",en:"Al-Jami"},{ar:"الغني",en:"Al-Ghani"},{ar:"المغني",en:"Al-Mughni"},{ar:"المانع",en:"Al-Mani"},{ar:"الضار",en:"Ad-Darr"},{ar:"النافع",en:"An-Nafi"},{ar:"النور",en:"An-Nur"},{ar:"الهادي",en:"Al-Hadi"},{ar:"البديع",en:"Al-Badi"},{ar:"الباقي",en:"Al-Baqi"},{ar:"الوارث",en:"Al-Warith"},{ar:"الرشيد",en:"Ar-Rashid"},{ar:"الصبور",en:"As-Sabur"}
    ];
    const g = document.getElementById('grid');
    nData.forEach(x => { g.innerHTML += `<div class="name-card" onclick="sp('${x.en}')"><div class="ar">${x.ar}</div><div style="font-size:0.75rem; opacity:0.6;">${x.en}</div></div>`; });
    function sp(t){ let u=new SpeechSynthesisUtterance(t); u.rate=0.8; speechSynthesis.speak(u); }

    // --- 📥 PRO INSTALL ENGINE ---
    let deferredPrompt;
    const installBtn = document.getElementById('install-section');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';
    });

    // iPhone (iOS) Auto-Detection
    if (!window.navigator.standalone && /iPhone|iPad|iPod/.test(navigator.userAgent)) {
        installBtn.style.display = 'block';
        installBtn.innerHTML = "📲 INSTALL ON IPHONE (Click Here)";
    }

    function triggerInstall() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choice) => {
                if (choice.outcome === 'accepted') installBtn.style.display = 'none';
            });
        } else {
            alert("iPhone users: Tap 'Share' button at bottom and select 'Add to Home Screen'. \n\nAndroid users: Click 3 dots at top-right and select 'Install App'.");
        }
    }
</script>
</body>
</html>
